name: Update latest.json

on:
  release:
    types:
      - published
      - edited
      - deleted
      - prereleased
      - released
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-latest-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout releases repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate latest.json from GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/generate_latest_json.py \
            --repo "${{ github.repository }}" \
            --output latest.json

      - name: Commit and push updated latest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if git diff --cached --quiet; then
            echo "latest.json unchanged."
            exit 0
          fi
          git commit -m "Update latest.json [skip ci]"
          git push
